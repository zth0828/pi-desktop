appId: io.github.zth0828.pidesktop
productName: Pi Desktop
copyright: Copyright (c) 2026 zth0828

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE
  - NOTICE

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.icns
    to: icon.icns

asar: true
npmRebuild: false

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

linux:
  icon: resources/icon.png
  category: Development
  maintainer: zth0828
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
