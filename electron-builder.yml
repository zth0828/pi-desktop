appId: io.github.zth0828.pidesktop
productName: Pi Desktop
copyright: Copyright (c) 2026 zth0828

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE
  - NOTICE

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.icns
    to: icon.icns

asar: true
npmRebuild: false

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  iconSize: 96
  contents:
    - x: 130
      y: 140
    - x: 410
      y: 140
      type: link
      path: /Applications
    - x: 270
      y: 285
      type: file
      path: resources/macos/Install Pi Desktop.command
    - x: 270
      y: 360
      type: file
      path: resources/macos/Uninstall Pi Desktop.command

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  license: LICENSE
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

linux:
  icon: resources/icon.png
  category: Development
  maintainer: zth0828
  desktop:
    entry:
      StartupWMClass: pi-desktop
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  afterRemove: resources/linux/after-remove.sh
  artifactName: ${productName}-${version}-${arch}.${ext}
