appId: io.github.zth0828.pidesktop
productName: Pi Desktop
copyright: Copyright (c) 2026 zth0828

directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE
  - NOTICE

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.icns
    to: icon.icns
  - from: resources/extensions
    to: extensions

asar: true
npmRebuild: false

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  iconSize: 96
  contents:
    - x: 130
      y: 140
    - x: 410
      y: 140
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  license: LICENSE
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
