name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-14
            command: pnpm exec electron-builder --mac --publish never
          - platform: Windows
            os: windows-2025
            command: pnpm exec electron-builder --win --publish never
          - platform: Linux
            os: ubuntu-24.04
            command: pnpm exec electron-builder --linux --publish never
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:vite
      - name: Select macOS signing mode
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          required=(
            MACOS_CSC_LINK
            MACOS_CSC_KEY_PASSWORD
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "MACOS_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
              echo "Building an ad-hoc signed macOS release with the bundled installer."
              exit 0
            fi
          done
          echo "MACOS_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          echo "Building a Developer ID signed and notarized macOS release."
      - name: Build signed and notarized macOS packages
        if: matrix.platform == 'macOS' && env.MACOS_RELEASE_SIGNED == 'true'
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build ad-hoc signed macOS packages
        if: matrix.platform == 'macOS' && env.MACOS_RELEASE_SIGNED != 'true'
        run: ${{ matrix.command }} -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: Verify macOS release
        if: matrix.platform == 'macOS'
        run: scripts/verify-macos-release.sh release "${MACOS_RELEASE_SIGNED:-false}"
      - name: Build unsigned Windows/Linux packages
        if: matrix.platform != 'macOS'
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create checksums
        shell: bash
        env:
          CHECKSUM_PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { readdir, rename, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const outputDir = 'release';
          const packageExtensions = ['.dmg', '.zip', '.exe', '.AppImage', '.deb'];
          const entries = (await readdir(outputDir, { withFileTypes: true }))
            .filter((entry) =>
              entry.isFile()
              && packageExtensions.some((extension) => entry.name.endsWith(extension))
            )
            .sort((left, right) => left.name.localeCompare(right.name));

          const lines = [];
          for (const entry of entries) {
            // GitHub normalizes spaces in release asset names to periods. Rename before
            // hashing so the published asset and checksum entry have the same name.
            const publishedName = entry.name.replaceAll(' ', '.');
            if (publishedName !== entry.name) {
              await rename(join(outputDir, entry.name), join(outputDir, publishedName));
            }
            const hash = createHash('sha256');
            for await (const chunk of createReadStream(join(outputDir, publishedName))) {
              hash.update(chunk);
            }
            lines.push(`${hash.digest('hex')}  ${publishedName}`);
          }

          await writeFile(
            join(outputDir, `SHA256SUMS-${process.env.CHECKSUM_PLATFORM}.txt`),
            `${lines.join('\n')}\n`,
          );
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: pi-desktop-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --verify-tag \
            --generate-notes \
            --title "Pi Desktop ${RELEASE_TAG}" \
            --notes "$(cat .github/release-notes.md)"
