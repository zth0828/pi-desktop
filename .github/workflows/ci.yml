name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contract
      - run: pnpm build:vite
      - name: Package smoke test
        run: pnpm exec electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  electron-e2e:
    name: Electron E2E (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # @ 文件补全走 fd（尊重 .gitignore）；pi 的按需下载在隔离 E2E 环境不稳定，
      # 直接用系统 fd 保证补全路径确定性。
      - run: brew install fd
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  electron-e2e-windows:
    name: Electron E2E (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # 同 macOS：@ 补全走系统 fd，避免 pi 按需下载在隔离环境不稳定。
      - run: choco install fd -y
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
